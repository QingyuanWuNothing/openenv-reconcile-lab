name: Validate public image anonymously

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Immutable ghcr.io image reference with @sha256 digest'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install replay harness
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Anonymous registry and image checks
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          mkdir -p reports
          export DOCKER_CONFIG=$(mktemp -d)
          python scripts/check_image.py "$IMAGE" > reports/registry.json
          docker pull --platform linux/amd64 "$IMAGE"
          docker inspect "$IMAGE" > reports/public-image.json
          docker run --rm -d --name public-test -p 8000:8000 "$IMAGE"
          python scripts/wait_ready.py --url http://localhost:8000
          openenv validate --url http://localhost:8000 > reports/openenv-runtime.txt
          python scripts/replay.py --url http://localhost:8000 > reports/public-replay.json
          printf '%s\n' "$IMAGE" > reports/image-digest.txt
          docker stop public-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: anonymous-validation
          path: reports/
      - name: Cleanup
        if: always()
        run: docker rm -f public-test || true
