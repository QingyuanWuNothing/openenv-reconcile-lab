name: Build self-contained eight-domain environment
on:
  push:
    branches: [workflow-standalone]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned SDK
        run: python -m pip install -r requirements.lock
      - name: Build amd64 image
        id: image
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/openenv-reconcile-lab:standalone-${GITHUB_SHA:0:12}"
          revision=$(python -c 'from workflow_lab.task_bank import release_revision; print(release_revision())')
          printf 'reference=%s\n' "$image" >> "$GITHUB_OUTPUT"
          mkdir -p reports
          printf '%s\n' "$revision" > reports/release-revision.txt
          docker build --platform linux/amd64 -f Dockerfile.standalone \
            --build-arg "RELEASE_REVISION=$revision" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
      - name: Verify worker identity and source protection
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker run --rm "$IMAGE" python -c 'import os,subprocess,sys; from pathlib import Path; from workflow_controller.execution import execute; assert os.getuid()==0; assert execute("def compute(data):\n    return data", [{"value":7}])=={"outputs":[{"value":7}]}; p=subprocess.run([sys.executable,"-I","-S","-c","from pathlib import Path; Path(\"/app/workflow_controller/engine.py\").read_text()"], user=10001,group=10001,extra_groups=[],capture_output=True); assert p.returncode!=0 and b"PermissionError" in p.stderr; assert not any((Path("/app")/n).exists() for n in ["tests","scripts","reports","dataset","dataset_v2","experiments","reconcile_lab"]); print("Restricted worker executes successfully; cannot read protected verifier; author policies, fixtures and traces absent")' > reports/worker-isolation.txt
      - name: Validate actual image without runtime configuration
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker run --rm -d --name standalone-test -p 8000:8000 "$IMAGE"
          python scripts/wait_ready.py --url http://localhost:8000
          openenv validate --url http://localhost:8000 > reports/openenv-runtime.txt
          python -c 'from pathlib import Path; s=Path("reports/openenv-runtime.txt").read_text(); assert "Verdict: PASS" in s and "FAIL" not in s'
          python scripts/check_standalone_image.py --url http://localhost:8000 > reports/protocol-checks.json
          docker inspect "$IMAGE" > reports/local-image.json
          docker stop standalone-test
      - name: Publish public image and pull anonymously
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker push "$IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > reports/image-digest.txt
          docker logout ghcr.io
          export DOCKER_CONFIG=$(mktemp -d)
          docker pull --platform linux/amd64 "$(cat reports/image-digest.txt)"
          python scripts/check_image.py "$(cat reports/image-digest.txt)" > reports/registry.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standalone-image-preflight
          path: reports/
      - name: Cleanup
        if: always()
        run: |
          docker logs standalone-test || true
          docker rm -f standalone-test || true
