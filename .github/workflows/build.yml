name: Build and publish environment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runtime and test dependencies
        run: |
          python -m pip install -r requirements.lock pytest==9.1.1 ruff==0.16.10
          python -m pip install --no-deps -e .
      - name: Verify generators, independent rewards and native protocol
        run: |
          ruff check reconcile_lab tests scripts
          pytest -q
      - name: Build amd64 image
        id: image
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/openenv-reconcile-lab:v1-${GITHUB_SHA:0:12}"
          printf 'reference=%s\n' "$image" >> "$GITHUB_OUTPUT"
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" .
      - name: Test the actual image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          mkdir -p reports
          docker run --rm -d --name reconcile-test -p 8000:8000 "$IMAGE"
          python scripts/wait_ready.py --url http://localhost:8000
          openenv validate --url http://localhost:8000 > reports/openenv-runtime.txt
          python scripts/replay.py --url http://localhost:8000 > reports/image-replay.json
          docker inspect "$IMAGE" > reports/local-image.json
          docker stop reconcile-test
      - name: Publish to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker push "$IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > reports/image-digest.txt
          docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-validation
          path: reports/
      - name: Cleanup
        if: always()
        run: docker rm -f reconcile-test || true
