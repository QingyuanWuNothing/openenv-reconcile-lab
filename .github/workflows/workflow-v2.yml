name: Build workflow proxy candidate

on:
  push:
    branches: [workflow-v2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned SDK
        run: python -m pip install -r requirements.lock
      - name: Build public amd64 proxy image
        id: image
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/openenv-reconcile-lab:workflow-v2-${GITHUB_SHA:0:12}"
          controller_revision=$(python -c 'import json; print(json.load(open("docs/workflow-v2-release.json"))["controller_revision"])')
          printf 'reference=%s\n' "$image" >> "$GITHUB_OUTPUT"
          docker build --platform linux/amd64 -f Dockerfile.v2 \
            --build-arg "CONTROLLER_REVISION=$controller_revision" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image" .
      - name: Verify actual image contents and SDK endpoints
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          mkdir -p reports
          docker run --rm "$IMAGE" python -c 'import importlib.util; from pathlib import Path; assert importlib.util.find_spec("workflow_controller") is None; assert importlib.util.find_spec("reconcile_lab") is None; assert not any((Path("/app")/name).exists() for name in ["tests","dataset","dataset_v2","reports","scripts","workflow_controller","reconcile_lab"]); print("Controller, v1 verifier, datasets, solvers and traces absent from /app")' > reports/image-isolation.txt
          docker run --rm -d --name workflow-test -p 8000:8000 "$IMAGE"
          python scripts/wait_ready.py --url http://localhost:8000
          openenv validate --url http://localhost:8000 > reports/openenv-runtime.txt
          python -c 'from pathlib import Path; report=Path("reports/openenv-runtime.txt").read_text(); assert "Verdict: PASS" in report and "FAIL" not in report'
          python -c 'import json,urllib.request; from workflow_lab.schemas import WorkflowAction,WorkflowObservation; data=json.load(urllib.request.urlopen("http://localhost:8000/schema")); assert data["action"]==WorkflowAction.model_json_schema(); assert data["observation"]==WorkflowObservation.model_json_schema(); print("Runtime schema equals declared schema")' > reports/schema-equality.txt
          docker inspect "$IMAGE" > reports/local-image.json
          docker stop workflow-test
      - name: Publish proxy candidate
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker push "$IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > reports/image-digest.txt
          docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-image-preflight
          path: reports/
      - name: Cleanup
        if: always()
        run: |
          docker logs workflow-test || true
          docker rm -f workflow-test || true

# This preflight intentionally reports packaging and SDK endpoints only.
# Full native image replay requires the separately approved live controller.
